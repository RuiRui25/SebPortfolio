<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me - Sebastian</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
            background-color: #ffffff;
            color: #333;
        }

        
        .navbar {
            display: flex;
            justify-content: space-between; 
            align-items: center;
            padding: 30px 5%; 
            border-bottom: 1px solid #000000;
        }

        .nav-logo {
            font-family: 'Georgia', serif;
            font-size: 25px;
            letter-spacing: 4px; 
            text-transform: uppercase;
            font-weight: 400;
            color: #000;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 40px; 
            padding: 0;
        }

        .nav-links a {
            text-decoration: none;
            color: black;
            font-size: 11px; 
            letter-spacing: 2px; 
            font-weight: 600;
            text-transform: uppercase; 
            transition: 0.3s ease;
        }

        .nav-links a:hover {
            color: #ff0000; 
        }

    
        .reach {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 100px 8%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .out { flex: 1.5; }

        .heading {
            font-family: 'Georgia', serif;
            font-size: 38px;
            font-weight: 400;
            line-height: 1.2;
            margin-bottom: 50px;
            color: #000;
        }

        .circle-outline {
            border: 1px solid #000;
            bord    er-radius: 50px;
            padding: 2px 15px;
            display: inline-block;
        }

    
        .footer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 0;
            background-color: #1a1a1a;
            color: white;
        }

        
        .contact {
            display: flex;
            list-style: none;
            gap: 25px;
            padding: 0;
            margin: 0;
        }

        .contact li a {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 60px;
            height: 60px;
            background: #ffffff;
            border-radius: 50%;
            text-decoration: none;
            transition: 0.4s ease;
            z-index: 1;
            overflow: hidden;
        }

        .contact li a i {
            font-size: 28px;
            color: #1a1a1a; 
            transition: 0.4s ease;
            z-index: 2;
        }

        .contact li a::before {
            content: '';
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            height: 100%;
            transition: 0.4s ease;
            z-index: 1;
        }

        .contact li a:hover::before {
            top: 0;
        }

        .contact li a:hover i {
            color: #ffffff; 
        }
          
    
        .contact li:nth-child(1) a:hover::before { background: #000000; } 
        .contact li:nth-child(2) a:hover::before { background: #ff0000; } 
        .contact li:nth-child(3) a:hover::before { background: #EA4335; } 
        .contact li:nth-child(4) a:hover::before { background: #1877F2; } 
        .contact li:nth-child(5) a:hover::before { background: #E4405F; } 

    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">Sebastian Carreon</div>
        <ul class="nav-links">
            <li><a href="index.html">HOME</a></li>
            <li><a href="home.html">ABOUT ME</a></li>
            <li><a href="collection.html">COLLECTIONS</a></li>
            <li><a href="contact.html" style="border-bottom: 1px solid black; padding-bottom: 5px;">CONTACT</a></li>
        </ul>
    </nav>

    <section class="reach">
        <div class="out">
            <h1 class="heading">
                Reach out if you want to create impactful photo art 
                <span class="circle-outline">together.</span>
            </h1>
        </div>
    </section>

    <footer class="footer-container">
        <p style="letter-spacing: 3px; font-size: 11px; margin-bottom: 30px; font-weight: bold;">CONNECT WITH ME</p>
        <ul class="contact">
            <li><a href="https://www.tiktok.com/@not.simplyseb"><i class="fa-brands fa-tiktok"></i></a></li>
            <li><a href="https://www.youtube.com/@SimplySeb25"><i class="fa-brands fa-youtube"></i></a></li>
            <li><a href="mailto:example@gmail.com"><i class="fa-solid fa-envelope"></i></a></li>
            <li><a href="https://www.facebook.com/sebastian.carreon.545"><i class="fa-brands fa-facebook-f"></i></a></li>
            <li><a href="https://www.instagram.com/simply.seb25?igsh=czB4OTNnZXI2a3ky"><i class="fa-brands fa-instagram"></i></a></li>
        </ul>
    </footer>

</body>
</html>
