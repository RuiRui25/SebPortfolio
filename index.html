<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Sebastian Carreon</title>
    <link rel="stylesheet" href="style.css">
</head>
    <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Helvetica', Arial, sans-serif;
    background-color: #fcfcfc;
    height: 100vh;
}

.container {
    display: flex;
    height: 100vh;
    width: 100%;
}
        
.content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-left: 10%;
    position: relative;
}

.subtitle {
    font-size: 12px;
    letter-spacing: 3px;
    color: #888;
    margin-bottom: 20px;
}

.name {
    font-family: 'Georgia', serif;
    font-size: 80px;
    line-height: 0.9;
    font-weight: 400;
    color: #111;
}

.footer-links {
    position: absolute;
    bottom: 10%;
    display: flex;
    gap: 60px;
    align-items: center;
}

.role {
    font-size: 12px;
    letter-spacing: 1.5px;
    color: #555;
}

.page-link {
    font-size: 12px;
    letter-spacing: 1.5px;
    color: #111;
    text-decoration: none;
    border-bottom: 1px solid #111;
    padding-bottom: 5px;
}

.image-area {
    flex: 1;
    overflow: hidden;
}

.image-area img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
      </style>
<body>

    <main class="container">
        <section class="content">
            <p class="subtitle">PORTFOLIO</p>
            <h1 class="name">Sebastian<br>Carreon</h1>
            
            <div class="footer-links">
                <span class="role">BSIT 1A</span>
                <a href="home.html" class= "page-link">Get Started</a>
            </div>
        </section>

        <section class="image-area">
            <img src="d.jpeg" alt="Laptop on desk">
        </section>
    </main>

</body>
</html>
